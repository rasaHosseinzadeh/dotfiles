# Minimal MangoWM configuration preserving the previous session's behavior.
# Validate after installing Mango with: mango -c ~/.config/mango/config.conf -p

# Environment ---------------------------------------------------------------

env=GDK_BACKEND,wayland
env=QT_QPA_PLATFORM,wayland
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=SDL_VIDEODRIVER,wayland
env=CLUTTER_BACKEND,wayland
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=BEMENU_BACKEND,wayland

# Startup -------------------------------------------------------------------
# Mango updates the systemd/DBus Wayland environment itself.

exec-once=mpd
exec-once=dunst
exec-once=mangobar
exec-once=lxqt-policykit-agent
exec-once=swaybg -c fill -i ~/pictures/wallpaper/bg.jpg
exec-once=swayidle -w timeout 900 'swaylock -f -c 222222' timeout 3600 'systemctl suspend-then-hibernate' before-sleep 'swaylock -f -c 222222'

# Lean visuals ---------------------------------------------------------------

blur=0
blur_layer=0
shadows=0
layer_shadows=0
animations=1
layer_animations=0
animation_type_open=fade
animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.85
fadeout_begin_opacity=0.90
tag_animation_direction=1
animation_duration_move=140
animation_duration_open=120
animation_duration_tag=0
animation_duration_close=100
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadein=0.46,1.0,0.29,1
animation_curve_opafadeout=0.46,1.0,0.29,1
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0

borderpx=1
gappih=1
gappiv=1
gappoh=1
gappov=1
smartgaps=1
no_border_when_single=1
no_radius_when_single=1

rootcolor=0x282a36ff
bordercolor=0x2b1ddf66
focuscolor=0x88527fee
urgentcolor=0xad401fff

# Input ----------------------------------------------------------------------

repeat_rate=25
repeat_delay=600
xkb_rules_layout=us,ir
xkb_rules_options=grp:alt_shift_toggle,caps:escape

mouse_natural_scrolling=0
mouse_accel_profile=1
mouse_accel_speed=0.5
axis_scroll_factor=1.0

tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_accel_profile=1
trackpad_accel_speed=0.5
trackpad_scroll_factor=1.0
disable_while_typing=1

# Window behavior and layouts ------------------------------------------------

focus_on_activate=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
xwayland_persistence=0
cursor_size=24

new_is_master=0
default_mfact=0.55
default_nmaster=1
tag_num=9
tag_gather=0

# SUPER+O cycles master-stack, PaperWM-style scroller, and monocle.
circle_layout=tile,scroller,monocle
tagrule=id:*,layout_name:tile

scroller_structs=0
scroller_default_proportion=0.95
scroller_default_proportion_single=0.95
scroller_focus_center=0
scroller_prefer_center=1
scroller_prefer_overspread=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_proportion_preset=0.95,0.75,0.5
scroller_ignore_proportion_single=0

# Applications ---------------------------------------------------------------

bind=SUPER,SPACE,spawn,bemenu-run-custom
bind=SUPER,RETURN,spawn,ghostty
bind=SUPER+ALT,V,spawn,ghostty -e wiremix
bind=SUPER+CTRL,W,spawn,networkmanager_dmenu
bind=SUPER+CTRL,M,spawn,ghostty -e ncmpcpp
bind=SUPER+SHIFT,H,spawn,ghostty -e yazi
bind=SUPER+ALT,P,spawn,keepassxc
bind=SUPER+ALT,Q,spawn,bm-off
bind=SUPER+ALT,B,spawn,bluetooth-toggle
bind=SUPER+ALT,M,spawn,bm-mount
bind=SUPER+ALT,U,spawn,bm-umount

# Region screenshot.
bind=SUPER+ALT,S,spawn,bm-scrot

# Window management ----------------------------------------------------------

bind=SUPER,Q,killclient
bind=SUPER+SHIFT+CTRL,Q,quit
bind=SUPER+SHIFT,SPACE,togglefloating
bind=SUPER,M,setlayout,monocle
bind=SUPER+SHIFT,M,togglemaximizescreen
bind=SUPER,TAB,focusstack,next

bind=SUPER,J,focusstack,prev
bind=SUPER,K,focusstack,next
bind=SUPER+SHIFT,K,focusdir,up
bind=SUPER+SHIFT,J,focusdir,down
bind=SUPER+ALT,J,groupfocus,prev
bind=SUPER+ALT,K,groupfocus,next

bind=SUPER,P,zoom
bind=SUPER,S,setlayout,scroller
bind=SUPER,T,setlayout,tile
bind=SUPER,O,togglejump
bind=SUPER,G,groupjoin,right
bind=SUPER+SHIFT,G,groupleave
bind=SUPER,X,switch_proportion_preset
bind=SUPER+ALT,H,scroller_stack,left
bind=SUPER+ALT,L,scroller_stack,right
bind=SUPER,H,setmfact,-0.05
bind=SUPER,L,setmfact,+0.05

# Tags -----------------------------------------------------------------------

bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move clients without following them.
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

bind=SUPER,PERIOD,focusmon,right
bind=SUPER+SHIFT,PERIOD,tagmon,right,1

# Mouse and touchpad ----------------------------------------------------------

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
gesturebind=NONE,left,4,viewtoright_have_client,0
gesturebind=NONE,right,4,viewtoleft_have_client,0

# Media ----------------------------------------------------------------------

bind=NONE,XF86AudioPrev,spawn,mpc -q prev
bind=NONE,XF86AudioNext,spawn,mpc -q next
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=SHIFT,XF86AudioPrev,spawn,mpc seek -5
bind=SHIFT,XF86AudioNext,spawn,mpc seek +5
bind=SHIFT,XF86AudioPlay,spawn,mpc toggle
bind=SHIFT,XF86AudioMute,spawn,mpc toggle

bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=SHIFT,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 1%+
bind=SHIFT,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 1%-

bind=NONE,XF86MonBrightnessDown,spawn,light -U 5
bind=NONE,XF86MonBrightnessUp,spawn,light -A 5
bind=SHIFT,XF86MonBrightnessDown,spawn,light -U 1
bind=SHIFT,XF86MonBrightnessUp,spawn,light -A 1

# Maintenance ----------------------------------------------------------------

bind=SUPER,R,reload_config
