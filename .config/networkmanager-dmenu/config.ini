[dmenu]
dmenu_command = bemenu-custom -l 12
active_chars = ==
compact = True
wifi_chars = ▂▄▆█
format = {bars} {name} {sec}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = True

[editor]
terminal = ghostty -e
gui_if_available = False

[nmdm]
rescan_delay = 5
show_notifications = True
